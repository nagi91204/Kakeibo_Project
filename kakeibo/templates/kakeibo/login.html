<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ログイン - 家計簿</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top, rgba(13, 110, 253, 0.16), transparent 30%),
                linear-gradient(180deg, #eef4ff 0%, #f8fafc 55%, #eef2ff 100%);
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .login-shell {
            min-height: calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        }

        .login-card {
            border: 0;
            border-radius: 1.25rem;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, #0d6efd 0%, #0b5ed7 45%, #084298 100%);
        }

        .login-logo {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            margin: 0 auto 1rem;
            background: rgba(255, 255, 255, 0.16);
            font-size: 1.8rem;
        }

        .login-input {
            min-height: 52px;
            border-radius: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="container d-flex align-items-center justify-content-center login-shell py-4">
        <div class="row justify-content-center w-100">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
                <div class="card login-card">
                    <div class="card-header login-header text-white text-center py-4">
                        <div class="login-logo">💰</div>
                        <h1 class="h4 mb-1 fw-bold">家計簿アプリ</h1>
                        <p class="mb-0 text-white-50 small">iPhoneの縦持ちでも使いやすいログイン画面</p>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <form method="post" class="d-grid gap-3">
                            {% csrf_token %}
                            <div>
                                <label class="form-label fw-semibold">メールアドレス / ユーザー名</label>
                                <input type="text" name="username" class="form-control login-input"
                                    placeholder="ユーザー名を入力" required>
                            </div>
                            <div>
                                <label class="form-label fw-semibold">パスワード</label>
                                <input type="password" name="password" class="form-control login-input"
                                    placeholder="パスワードを入力" required>
                            </div>
                            {% if form.errors %}
                            <div class="alert alert-danger mb-0">
                                ユーザー名またはパスワードが間違っています
                            </div>
                            {% endif %}
                            <button type="submit" class="btn btn-primary btn-lg w-100">ログイン</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
