<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - 家計簿</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white text-center">
                        <h4 class="mb-0">💰 家計簿アプリ</h4>
                    </div>
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label fw-bold">メールアドレス / ユーザー名</label>
                                <input type="text" name="username" class="form-control" placeholder="ユーザー名を入力" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">パスワード</label>
                                <input type="password" name="password" class="form-control" placeholder="パスワードを入力"
                                    required>
                            </div>
                            {% if form.errors %}
                            <div class="alert alert-danger">
                                ユーザー名またはパスワードが間違っています
                            </div>
                            {% endif %}
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">ログイン</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
