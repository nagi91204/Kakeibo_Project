<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>家計簿アプリ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --app-bg: #f4f7fb;
            --app-surface: rgba(255, 255, 255, 0.88);
            --app-border: rgba(15, 23, 42, 0.08);
            --app-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
            --app-radius: 1.1rem;
        }

        body {
            background:
                radial-gradient(circle at top left, rgba(13, 110, 253, 0.12), transparent 30%),
                radial-gradient(circle at top right, rgba(25, 135, 84, 0.10), transparent 26%),
                var(--app-bg);
            min-height: 100vh;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .app-shell {
            max-width: 1180px;
        }

        .app-card {
            border: 1px solid var(--app-border);
            border-radius: var(--app-radius);
            box-shadow: var(--app-shadow);
            overflow: hidden;
        }

        .app-panel {
            background: var(--app-surface);
            border: 1px solid var(--app-border);
            border-radius: var(--app-radius);
            box-shadow: var(--app-shadow);
            backdrop-filter: blur(12px);
        }

        .app-offcanvas {
            background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
        }

        .app-nav-button {
            min-height: 52px;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .app-nav-button-outline {
            border: 1px solid rgba(255, 255, 255, 0.45);
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        .app-nav-button-light {
            border: 1px solid rgba(13, 110, 253, 0.14);
            background: #fff;
            color: #0d6efd;
            box-shadow: 0 10px 24px rgba(13, 110, 253, 0.08);
        }

        .app-table {
            margin-bottom: 0;
        }

        .app-table thead th {
            font-size: 0.9rem;
            letter-spacing: 0.02em;
        }

        .btn {
            border-radius: 0.9rem;
        }

        .form-control,
        .form-select {
            border-radius: 0.9rem;
            min-height: 48px;
        }

        @media (max-width: 767.98px) {
            .app-shell {
                padding-left: 0.8rem;
                padding-right: 0.8rem;
            }

            .page-title {
                font-size: 1.15rem;
            }

            .btn,
            .form-control,
            .form-select {
                min-height: 50px;
            }

            .mobile-stack .btn {
                width: 100%;
            }

            .mobile-actions .btn,
            .mobile-actions form {
                width: 100%;
            }

            .mobile-actions .btn+.btn,
            .mobile-actions .btn+form,
            .mobile-actions form+.btn,
            .mobile-actions form+form {
                margin-top: 0.5rem;
            }
        }

        @media (max-width: 991.98px) {
            .offcanvas.app-offcanvas {
                width: 100vw;
                max-width: 100vw;
                height: 100vh;
                border: 0;
                border-radius: 0;
            }
        }
    </style>

</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary py-3">
        <div class="container app-shell">
            <a class="navbar-brand fw-bold" href="{% url 'kakeibo:home' %}">家計簿アプリ</a>
            <button class="navbar-toggler d-lg-none" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#mobileMenu" aria-controls="mobileMenu" aria-label="メニューを開く">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="d-none d-lg-flex ms-auto align-items-center gap-2">
                <a class="btn btn-outline-light btn-sm app-nav-button" href="{% url 'kakeibo:list' %}">一覧</a>
                <a class="btn btn-outline-light btn-sm app-nav-button" href="{% url 'kakeibo:add' %}">入力</a>
                <a class="btn btn-outline-light btn-sm app-nav-button" href="{% url 'kakeibo:chart' %}">グラフ</a>
                <a class="btn btn-outline-light btn-sm app-nav-button" href="{% url 'kakeibo:category' %}">カテゴリ</a>
                <form method="post" action="{% url 'logout' %}" class="ms-2">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-light btn-sm app-nav-button px-3">ログアウト</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="offcanvas offcanvas-end app-offcanvas" tabindex="-1" id="mobileMenu" aria-labelledby="mobileMenuLabel">
        <div class="offcanvas-header border-bottom">
            <div>
                <h5 class="offcanvas-title mb-1" id="mobileMenuLabel">メニュー</h5>
                <div class="small text-muted">iPhoneの縦画面でも見やすい表示</div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="閉じる"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column gap-2 p-3 p-sm-4">
            <a class="btn app-nav-button-light w-100" href="{% url 'kakeibo:list' %}">一覧</a>
            <a class="btn app-nav-button-light w-100" href="{% url 'kakeibo:add' %}">入力</a>
            <a class="btn app-nav-button-light w-100" href="{% url 'kakeibo:chart' %}">グラフ</a>
            <a class="btn app-nav-button-light w-100" href="{% url 'kakeibo:category' %}">カテゴリ</a>
            <form method="post" action="{% url 'logout' %}" class="pt-1">
                {% csrf_token %}
                <button type="submit" class="btn btn-primary w-100 app-nav-button">ログアウト</button>
            </form>
        </div>
    </div>

    <main class="container app-shell py-3 py-md-4">
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
