{% extends 'kakeibo/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-6">
        <div class="card app-card">
            <div class="card-header bg-primary text-white d-flex align-items-center justify-content-between gap-2">
                <h5 class="mb-0">{{ title }}</h5>
                <a href="{% url back_url %}"
                    class="btn btn-light btn-sm d-inline-flex align-items-center justify-content-center">戻る</a>
            </div>
            <div class="card-body p-3 p-md-4">
                <form method="post" class="d-grid gap-3">
                    {% csrf_token %}
                    {% for field in form %}
                    <div>
                        <label class="form-label fw-bold">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                        <div class="text-danger small">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                    {% endfor %}
                    <div class="d-grid gap-2 d-md-flex justify-content-center">
                        <button type="submit"
                            class="btn btn-primary d-inline-flex align-items-center justify-content-center">{{
                            submit_label }}</button>
                        <a href="{% url back_url %}"
                            class="btn btn-outline-secondary d-inline-flex align-items-center justify-content-center">キャンセル</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
