{% extends 'kakeibo/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-6">
        <div class="card app-card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">収支を入力</h5>
            </div>
            <div class="card-body p-3 p-md-4">
                <form method="post" class="d-grid gap-3">
                    {% csrf_token %}
                    <div>
                        <label class="form-label fw-bold">{{ form.date.label }}</label>
                        {{ form.date }}
                    </div>
                    <div>
                        <label class="form-label fw-bold">{{ form.transaction_type.label }}</label>
                        {{ form.transaction_type }}
                    </div>
                    <div>
                        <label class="form-label fw-bold">{{ form.category.label }}</label>
                        {{ form.category }}
                    </div>
                    <div id="payment-method-row">
                        <label class="form-label fw-bold">{{ form.payment_method.label }}</label>
                        {{ form.payment_method }}
                    </div>
                    <div>
                        <label class="form-label fw-bold">{{ form.amount.label }}</label>
                        {{ form.amount }}
                    </div>
                    <div>
                        <label class="form-label fw-bold">{{ form.memo.label }}</label>
                        {{ form.memo }}
                    </div>
                    <div class="d-grid gap-2 d-md-flex justify-content-center">
                        <button type="submit"
                            class="btn btn-outline-primary w-100 d-inline-flex align-items-center justify-content-center">保存する</button>
                        <a href="{% url 'kakeibo:list' %}"
                            class="btn btn-outline-secondary w-100 d-inline-flex align-items-center justify-content-center">戻る</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    const typeSelect = document.getElementById('id_transaction_type');
    const categorySelect = document.getElementById('id_category');
    const paymentMethodRow = document.getElementById('payment-method-row');
    const paymentMethodSelect = document.getElementById('id_payment_method');

    function setPaymentMethodVisibility(type) {
        if (type === 'income') {
            paymentMethodRow.style.display = 'none';
            paymentMethodSelect.disabled = true;
            paymentMethodSelect.value = '';
        } else {
            paymentMethodRow.style.display = '';
            paymentMethodSelect.disabled = false;
        }
    }

    function filterCategories(type) {
        setPaymentMethodVisibility(type);

        fetch(`/api/categories/?type=${encodeURIComponent(type)}`)
            .then(res => res.json())
            .then(data => {
                categorySelect.innerHTML = '<option value="">---------</option>';
                data.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat.id;
                    option.textContent = cat.name;
                    categorySelect.appendChild(option);
                });
            });
    }

    filterCategories(typeSelect.value);

    typeSelect.addEventListener('change', function () {
        filterCategories(this.value);
    });
</script>
{% endblock %}
