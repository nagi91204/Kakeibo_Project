{% extends 'kakeibo/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-6">
        <div class="card app-card">
            <div class="card-header bg-warning text-dark">
                <h5 class="mb-0">収支を編集</h5>
            </div>
            <div class="card-body p-3 p-md-4">
                <form method="post" class="d-grid gap-3">
                    {% csrf_token %}
                    {% for field in form %}
                    <div {% if field.name=='payment_method' %}id="payment-method-row" {% endif %}>
                        <label class="form-label fw-bold">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                        <div class="text-danger small">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                    {% endfor %}
                    <div class="d-grid gap-2 d-md-flex justify-content-center">
                        <button type="submit"
                            class="btn btn-outline-warning w-100 d-inline-flex align-items-center justify-content-center">更新する</button>
                        <a href="{% url 'kakeibo:list' %}"
                            class="btn btn-outline-secondary w-100 d-inline-flex align-items-center justify-content-center">キャンセル</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    const currentCategoryId = "{{ transaction.category.id }}";
    const typeSelect = document.getElementById('id_transaction_type');
    const categorySelect = document.getElementById('id_category');
    const paymentMethodRow = document.getElementById('payment-method-row');
    const paymentMethodSelect = document.getElementById('id_payment_method');

    function setPaymentMethodVisibility(type) {
        if (type === 'income') {
            paymentMethodRow.style.display = 'none';
            paymentMethodSelect.disabled = true;
            paymentMethodSelect.value = '';
        } else {
            paymentMethodRow.style.display = '';
            paymentMethodSelect.disabled = false;
        }
    }

    function filterCategories(type, selectedId = null) {
        setPaymentMethodVisibility(type);

        fetch(`/api/categories/?type=${encodeURIComponent(type)}`)
            .then(res => res.json())
            .then(data => {
                categorySelect.innerHTML = '<option value="">---------</option>';
                data.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat.id;
                    option.textContent = cat.name;
                    if (String(cat.id) === String(selectedId)) {
                        option.selected = true;
                    }
                    categorySelect.appendChild(option);
                });
            });
    }

    filterCategories(typeSelect.value, currentCategoryId);

    typeSelect.addEventListener('change', function () {
        filterCategories(this.value);
    });
</script>
{% endblock %}
