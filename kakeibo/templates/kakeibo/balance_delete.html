{% extends 'kakeibo/base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-12 col-lg-6">
        <div class="card app-card">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0">残高を削除</h5>
            </div>
            <div class="card-body p-3 p-md-4">
                <p class="mb-3">以下の残高を削除しますか？</p>
                <table class="table table-bordered align-middle mb-4">
                    <tr>
                        <th>支払い元</th>
                        <td>{{ balance.payment_method }}</td>
                    </tr>
                    <tr>
                        <th>残高</th>
                        <td>{{ balance.balance }}円</td>
                    </tr>
                </table>
                <form method="post" class="d-flex flex-column flex-sm-row gap-2 justify-content-center mobile-actions">
                    {% csrf_token %}
                    <button type="submit"
                        class="btn btn-danger flex-fill flex-sm-shrink-0 text-nowrap d-inline-flex align-items-center justify-content-center">削除する</button>
                    <a href="{% url 'kakeibo:category' %}"
                        class="btn btn-outline-secondary flex-fill flex-sm-shrink-0 text-nowrap d-inline-flex align-items-center justify-content-center">キャンセル</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
